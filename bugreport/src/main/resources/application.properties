spring.application.name=bugreport
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
server.port=${PORT:8080}
discord.webhook-url=${DISCORD_WEBHOOK_URL}
spring.web.error.include-stacktrace=never
server.forward-headers-strategy=native

# Bucket4j config
spring.cache.cache-names=rate-limit-buckets
spring.cache.caffeine.spec=maximumSize=100000,expireAfterAccess=10m

bucket4j.filters[0].cache-name=rate-limit-buckets
bucket4j.filters[0].url=/api/report.*
bucket4j.filters[0].strategy=all
bucket4j.filters[0].http-response-body={"error":"Too many reports, try again later"}

# Limit of 5 reports per person per minute
bucket4j.filters[0].rate-limits[0].execute-condition=getMethod() == 'POST'
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# Limit global requests to 25 in a minute
bucket4j.filters[0].rate-limits[1].execute-condition=getMethod() == 'POST'
bucket4j.filters[0].rate-limits[1].cache-key='global'
bucket4j.filters[0].rate-limits[1].bandwidths[0].capacity=25
bucket4j.filters[0].rate-limits[1].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[1].bandwidths[0].unit=minutes